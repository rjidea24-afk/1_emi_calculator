<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI कैलकुलेटर</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>EMI कैलकुलेटर</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label>लोन की राशि (Loan Amount - ₹):</label>
                <input type="number" step="any" name="principal" placeholder="उदा. 500000" required>
            </div>

            <div class="input-group">
                <label>वार्षिक ब्याज दर (Annual Interest Rate - %):</label>
                <input type="number" step="any" name="rate" placeholder="उदा. 8.5" required>
            </div>

            <div class="input-group">
                <label>अवधि (Tenure):</label>
                <div class="tenure-box">
                    <input type="number" step="any" name="tenure" placeholder="उदा. 5 या 60" required>
                    <select name="tenure_type">
                        <option value="years">वर्ष (Years)</option>
                        <option value="months">महीने (Months)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn">गणना करें (Calculate)</button>
        </form>

        {% if emi %}
            <div class="result">
                <h3>गणना परिणाम:</h3>
                <p><strong>मासिक EMI:</strong> ₹ {{ emi }}</p>
                <p><strong>कुल ब्याज:</strong> ₹ {{ total_interest }}</p>
                <p><strong>कुल भुगतान:</strong> ₹ {{ total_payment }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
